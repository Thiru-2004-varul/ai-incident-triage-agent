version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: incident-triage-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount the entire project so n8n can call the Python agent
      - .:/opt/incident-triage
    networks:
      - triage-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: incident-triage-agent
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - triage-net
    # Kept running so n8n can exec into it
    command: tail -f /dev/null

volumes:
  n8n_data:

networks:
  triage-net:
    driver: bridge
